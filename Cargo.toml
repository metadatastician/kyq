# SPDX-License-Identifier: MPL-2.0
[package]
name = "kyq"
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
license = "MPL-2.0"
description = "Bounded KYAML, I-JSON/JCS, Dhall and TOML 1.0 validation for repository automation"
repository = "https://github.com/metadatastician/kyq"
readme = "README.adoc"
keywords = ["kyaml", "json", "jcs", "dhall", "kubernetes"]
categories = ["command-line-utilities", "encoding"]

[dependencies]
kyq-bounds = { path = "verification/bounds" }
ijson-jcs = { git = "https://github.com/hyperpolymath/ijson-jcs", rev = "c7091491ad48b64c19ee9bb754a28186f8e94042" }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
serde_dhall = { version = "0.13", default-features = false }
yaml-rust2 = "0.11"
regex = "1"
# Counting global allocator: caps the Dhall worker's heap with no unsafe code
# in kyq (W7). serde_dhall has no memory bound of its own.
cap = "=0.1.2"
# TOML 1.0 validity-only parser; keep the typed document and its trivia intact.
toml_edit = { version = "=0.22.27", default-features = false, features = ["parse"] }

[dev-dependencies]
proven-evidence = { git = "https://github.com/hyperpolymath/proven-tests-and-benches", rev = "2e978736732651098022169a6d1680e771eefc3e" }
proptest = "1.9"

[[bench]]
name = "parsing"
harness = false

[profile.release]
lto = true
codegen-units = 1
strip = true
