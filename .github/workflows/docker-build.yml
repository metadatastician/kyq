# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
name: Podman container qualification
on:
  pull_request:
    paths:
      - 'Containerfile'
      - '.containerignore'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'verification/bounds/**'
      - 'Justfile'
      - 'build/container/**'
      - 'build/just/container.just'
      - '.github/workflows/docker-build.yml'
  push:
    tags: ['v*']
  workflow_dispatch:

# Scope + cancel superseded runs (estate guardrail).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  container:
    # OFF by default — costs nothing in derived repos. A repo opts in by setting
    # the repository/organisation variable CONTAINER_CI=true. When enabled it
    # runs on OWNED self-hosted runners (no metered GitHub Actions minutes);
    # override the labels with the CONTAINER_RUNNER variable (a JSON array).
    if: vars.CONTAINER_CI == 'true'
    runs-on: ${{ fromJSON(vars.CONTAINER_RUNNER || '["self-hosted","owned","container"]') }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Tooling check
        run: |
          command -v just >/dev/null 2>&1 || { echo "::error::just not found on this runner"; exit 1; }
          # The supported engine is Podman.
          command -v podman >/dev/null 2>&1 || { echo "::error::podman not found on this runner"; exit 1; }

      - name: Build image
        run: just container-build

      - name: Test the native container
        run: just container-test

      - name: Scan image
        run: |
          command -v trivy >/dev/null 2>&1 || { echo "::error::trivy required on the container runner"; exit 1; }
          archive=$(mktemp --suffix=.tar)
          trap 'rm -f "$archive"' EXIT
          podman save --format docker-archive --output "$archive" localhost/kyq:dev
          trivy image --severity HIGH,CRITICAL --exit-code 1 --input "$archive"
      # This job qualifies the OCI image. Stapeln CTP signing is a separate open
      # acceptance obligation recorded in docs/ASSURANCE.adoc; no bundle is claimed.
