# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
name: OSSF Scorecard

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  actions: read      # required by the reusable workflow (staleness check reads workflow runs)
  contents: read

jobs:
  scorecard:
    uses: hyperpolymath/standards/.github/workflows/scorecard-reusable.yml@cf8f91219d80da55cf8cbbfcd587d00c2d8798ed
    # Reusable called-workflow permissions are CAPPED by the caller's grants;
    # without security-events: write here the scorecard SARIF upload fails with
    # startup_failure (hypatia WF018). id-token: write enables OIDC publish.
    # actions: read is required by the reusable's job (standards#451); without
    # it GitHub refuses the run at startup (B-PERMS, metadatastician-governance#30).
    permissions:
      actions: read
      contents: read
      security-events: write
      id-token: write
