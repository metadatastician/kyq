# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
#
# CI for kyq. It runs only the checks that can run today. There is no build,
# test or release job: AffineScript 0.1.1 does not parse the sources, so any
# such job could only upload a placeholder (docs/status/ROADMAP.adoc,
# Blockers). Add them back when `affinescript compile` produces a module.
name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '**.adoc'
      - '**.txt'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  metadata:
    name: Metadata Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # One deed per repo (owner rulings D308, D312). Fail-closed: a missing
      # deed, a second deed, a #u7 literal or any .a2ml file is an error.
      - name: Validate repo deed
        run: |
          set -euo pipefail
          mapfile -t deeds < <(find . -maxdepth 1 -name '*_chora.deed' -type f)
          if [ "${#deeds[@]}" -ne 1 ]; then
            echo "::error::expected exactly one *_chora.deed at the repo root, found ${#deeds[@]}"
            exit 1
          fi
          deed="${deeds[0]}"
          grep -q ':schema-version "' "$deed" || { echo "::error file=$deed::no :schema-version"; exit 1; }
          grep -q '(status' "$deed" || { echo "::error file=$deed::no (status ...) clause"; exit 1; }
          if grep -n '#u7"' "$deed"; then
            echo "::error file=$deed::#u7 literals are illegal (owner ruling D305)"
            exit 1
          fi
          a2ml="$(git ls-files '*.a2ml')"
          if [ -n "$a2ml" ]; then
            echo "::error::A2ML is retired; remove: $a2ml"
            exit 1
          fi
          echo "deed OK: $deed"

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # shellcheck is preinstalled on ubuntu-latest runners. Every tracked
      # script is checked for errors; the repo-owned launcher also for
      # warnings. The hooks and scripts/ are synced from rsr-template-repo,
      # so their warnings are fixed there, not here.
      - name: Run shellcheck on tracked shell scripts
        run: |
          set -euo pipefail
          mapfile -t scripts < <(git ls-files '*.sh')
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "::error::no tracked shell scripts found; the check would be vacuous"
            exit 1
          fi
          shellcheck --severity=error "${scripts[@]}"
          shellcheck --severity=warning kyq-launcher.sh

  # A1 evidence collection is manual until the strict port clears. This job
  # does not run on push/PR and a completed census is NOT a build/test PASS.
  # The compiler and its digest are pinned independently of floating `main`.
  affine-a1-census:
    name: AffineScript A1 grammar census (manual; not a build gate)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned AffineScript v0.1.1
        env:
          AFFINE_VERSION: v0.1.1
          AFFINE_SHA256: b8f2cab7380306ca07b9599d7fe2470328236e7287a51c78c3bbb5e973fef5dc
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/hyperpolymath/affinescript/releases/download/${AFFINE_VERSION}/affinescript-linux-x64" \
            -o "$RUNNER_TEMP/affinescript"
          echo "${AFFINE_SHA256}  $RUNNER_TEMP/affinescript" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/affinescript"
          "$RUNNER_TEMP/affinescript" --version

      - name: Record A1 grammar and current-source census
        run: |
          set -euo pipefail
          export AFFINESCRIPT="$RUNNER_TEMP/affinescript"
          test -x "$AFFINESCRIPT"
          bash scripts/affine-a1-probe.sh
