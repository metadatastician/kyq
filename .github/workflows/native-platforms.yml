# SPDX-License-Identifier: MPL-2.0
name: Native platforms
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-platforms-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.99.1"
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --doc
      - run: bash launcher.sh --help
      - run: bash build/just/provision-lib.sh langs
      - name: Build and exercise native release packaging
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          rustup target add "$RELEASE_TARGET"
          cargo build --locked --release --target "$RELEASE_TARGET" --bin kyq
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "kyq") | .version')
          bash scripts/package-release.sh "$RELEASE_TARGET" "$version"
          bash scripts/smoke-native-archive.sh "$RELEASE_TARGET" "$version"
