# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
name: Release
on:
  push:
    tags: ['v*']
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  quality:
    uses: hyperpolymath/proven-cicd-and-workflows/.github/workflows/rust-ci.yml@9eb0bbf9bd80b7964ce5b9957e75821b3cd4a55b
  build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}
      - name: Verify tag matches package version
        run: |
          set -euo pipefail
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "kyq") | .version')
          test "$GITHUB_REF_NAME" = "v$version"
          echo "KYQ_VERSION=$version" >> "$GITHUB_ENV"
      - run: cargo test --locked --all-targets --target '${{ matrix.target }}'
      - run: cargo test --locked --doc --target '${{ matrix.target }}'
      - run: cargo build --locked --release --target '${{ matrix.target }}' --bin kyq
      - name: Package native executable and licences
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: bash scripts/package-release.sh "$RELEASE_TARGET" "$KYQ_VERSION"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: native-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: native-*
          path: artifacts
          merge-multiple: true
      - name: Check complete artifact set and checksums
        run: |
          set -euo pipefail
          cd artifacts
          test "$(find . -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 3
          test "$(find . -maxdepth 1 -name '*.sha256' | wc -l)" -eq 3
          for checksum in *.sha256; do sha256sum --check --strict "$checksum"; done
      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: artifacts/*.tar.gz
      - name: Publish native archives with generated release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          flags=()
          case "$RELEASE_TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes "${flags[@]}" artifacts/*
